<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="list-group shadow-sm rounded-3">
      
      @for (item of ArrayTodo; track $index) {
        <div class="list-group-item list-group-item-action d-flex justify-content-between align-items-center p-3"
             [class.bg-light]="item.isChecked">
          
          <div class="form-check d-flex align-items-center mb-0">
            <input 
              class="form-check-input me-3 p-2" 
              type="checkbox" 
              [checked]="item.isChecked" 
              [disabled]="item.isChecked" 
              (change)="updateChecked($index)"
              id="todoCheck-{{$index}}" />
            
            <label class="form-check-label h5 mb-0 text-dark fw-medium" 
                   [class.text-decoration-line-through]="item.isChecked"
                   [class.text-muted]="item.isChecked"
                   for="todoCheck-{{$index}}">
              {{ item.title }}
            </label>
          </div>

          @if (item.isChecked) {
            <span class="badge bg-success rounded-pill px-3 py-2">Done ✓</span>
          } @else {
            <span class="badge bg-warning text-dark rounded-pill px-3 py-2">Pending</span>
          }

        </div>
      } @empty {
        <div class="text-center p-5 bg-white rounded-3 border">
          <i class="far fa-clipboard fa-3x text-muted mb-3 d-block"></i>
          <p class="text-muted mb-0">No tasks added yet. Start by adding one above!</p>
        </div>
      }

    </div>
  </div>
</div>
